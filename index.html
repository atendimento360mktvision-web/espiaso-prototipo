<style>
:root{--ink:#232122;--ink2:#373435;--mute:#7E797A;--paper:#F6F2EA;--card:#fff;--line:#E8DFCF;--acc:#AC7E37;--acc-soft:#F3E8D2;--gold:#CC9944;--grad:linear-gradient(135deg,#AC7E37 0%,#D7A454 30%,#E4B05D 50%,#BD8E47 75%,#DFAC58 100%);--ok:#1F9D6B;--bad:#C2413B;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
#sec-modelos{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.005em;line-height:1.02;margin:0}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.acc{background:var(--grad);color:#232122}
.btn.acc:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.lg{padding:15px 24px;font-size:16px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px #F1C9C9}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
.iconbtn.del:hover{border-color:var(--bad);color:var(--bad)}
.field{display:block;margin-bottom:14px}
.field>span{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink2)}
.inp,.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:none;transition:border-color .15s}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:76px}
.prefix{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
.prefix:focus-within{border-color:var(--ink)}
.prefix em{font-style:normal;color:var(--mute);padding-left:12px;white-space:nowrap}
.prefix input{border:0!important;padding-left:2px!important}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{font-size:19px;margin-bottom:4px}
.sub{color:var(--mute);font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#EFEBE3;color:var(--ink2);white-space:nowrap}
.pill.pro{background:var(--acc-soft);color:#8A6428}
.pill.ok{background:#DDF3E8;color:#14724C}
.pill.off{background:#F7DEDE;color:#A12D2D}
.pill.dark{background:var(--ink);color:#fff}
.logo{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink2)}
.logo svg{height:72px;width:auto;display:block}
.side .logo{color:#fff}
.side .logo svg{height:64px}
.lsym{display:inline-block;color:var(--ink2)}
.lsym svg{height:100%;width:auto;display:block}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(23,21,31,.55);display:grid;place-items:center;z-index:90;padding:16px;backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:20px;padding:26px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox h3{font-size:24px;margin-bottom:6px}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* landing */
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,48px);max-width:1240px;margin:0 auto}
.nav nav{display:flex;align-items:center;gap:22px}
.nav nav a.t{text-decoration:none;font-weight:600;color:var(--ink2)}
.nav nav a.t:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:30px clamp(16px,4vw,48px) 70px;max-width:1240px;margin:0 auto}
.hero h1{font-size:clamp(52px,7vw,98px);font-weight:400;margin:14px 0 22px;line-height:.96}
.hero h1 em{font-style:italic;font-weight:400;color:var(--gold);position:relative}
.hero p.lead{font-size:19px;color:var(--ink2);max-width:520px;margin-bottom:28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .proof{display:flex;gap:22px;margin-top:34px;color:var(--ink2);font-size:14px;flex-wrap:wrap}
.hero .proof b{display:block;font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1.1;color:var(--ink)}
.stack{position:relative;height:580px}
.ph{position:absolute;width:262px;height:540px;border-radius:38px;background:#111;padding:9px;box-shadow:0 30px 60px rgba(23,21,31,.25)}
.ph .screen{border-radius:30px}
.ph:nth-child(1){left:0;top:36px;transform:rotate(-7deg)}
.ph:nth-child(2){left:50%;top:0;transform:translateX(-50%);z-index:2}
.ph:nth-child(3){right:0;top:36px;transform:rotate(7deg)}
.sec{max-width:1240px;margin:0 auto;padding:70px clamp(16px,4vw,48px)}
.sec>h2{font-size:clamp(32px,4vw,48px);margin:10px 0 10px}
.sec>.sub{font-size:17px;max-width:560px;margin-bottom:34px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step .n{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:48px;color:var(--gold);line-height:1}
.step h3{margin:14px 0 6px;font-size:21px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;transition:transform .2s}
.gcard:hover{transform:translateY(-3px)}
.gcard .meta{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 2px;font-weight:700}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}
.plan.hl{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan.hl .sub{color:#B8B1A6}
.plan .price{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:42px;margin:14px 0 2px}
.plan .price small{font-size:15px;font-weight:500;opacity:.7}
.plan ul{list-style:none;padding:0;margin:18px 0 24px;display:grid;gap:9px;flex:1;align-content:start}
.plan li{display:flex;gap:9px;align-items:flex-start}
.plan li::before{content:"";flex:none;width:12px;height:2px;background:var(--gold);margin-top:10px}
.cta-band{background:var(--ink);color:#fff;border-radius:28px;padding:clamp(28px,5vw,60px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta-band h2{font-size:clamp(30px,4vw,46px);max-width:620px}
.foot{max-width:1240px;margin:0 auto;padding:30px clamp(16px,4vw,48px) 50px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;margin-left:18px}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .l{padding:28px clamp(16px,5vw,64px);display:flex;flex-direction:column}
.auth .l form,.auth .l .box{margin:auto 0;max-width:430px;width:100%;padding:30px 0}
.auth h1{font-size:40px;margin:8px 0 8px}
.auth .r{background:var(--ink);display:grid;place-items:center;padding:30px;position:relative;overflow:hidden}
.auth .r::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:var(--gold);opacity:.14;filter:blur(40px);top:-140px;right:-160px}
.tpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpick label{border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;background:#fff}
.tpick input{display:none}
.tpick label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.tpick .sw{height:34px;border-radius:8px;margin-bottom:6px}
.acc-list{display:grid;gap:8px;margin-top:10px}
.acc-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.acc-row .nm{flex:1;min-width:0}
.acc-row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-s{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--acc-soft);color:#8A6428;overflow:hidden}
.av-s img{width:100%;height:100%;object-fit:cover}

/* app shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 380px;min-height:100vh}
.app.adm{grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--ink);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{padding:0 8px 18px}
.side .role{margin:0 8px 14px;align-self:flex-start;background:rgba(204,153,68,.16);color:#E4B05D}
.side a.tab{color:#C9C2B8;padding:10px 12px;border-radius:11px;text-decoration:none;font-weight:600;display:flex;gap:11px;align-items:center}
.side a.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.side a.tab.on{background:rgba(255,255,255,.12);color:#fff}
.side a.tab.on .i{color:var(--acc)}
.sfoot{margin-top:auto;display:grid;gap:8px;font-size:13px;color:#B8B1A6;padding:0 6px}
.sfoot a{color:#fff;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;cursor:pointer}
.mode{display:flex;gap:7px;align-items:flex-start;line-height:1.35}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;margin-top:5px}
.dot.local{background:#F2B33D}
.main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.mhead h2{font-size:34px;margin-top:4px}
.mhead-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-right:6px}
.urlbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px dashed #D5CEC1;border-radius:12px;padding:10px 14px;margin-bottom:20px;color:var(--ink2);font-size:14px;flex-wrap:wrap}
.urlbar b{color:var(--ink)}
.stackc{display:grid;gap:18px}
.prev{border-left:1px solid var(--line);background:#EEEAE2;display:flex;flex-direction:column;align-items:center;padding:24px 20px;position:sticky;top:0;height:100vh}
.prev .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.phone{width:300px;height:min(620px,calc(100vh - 90px));border-radius:42px;background:#111;padding:10px;box-shadow:0 24px 50px rgba(23,21,31,.22)}
.screen{width:100%;height:100%;border-radius:32px;overflow:auto;background:#fff;display:flex;flex-direction:column;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.av-edit{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.av-big{width:78px;height:78px;border-radius:50%;background:var(--acc-soft);display:grid;place-items:center;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:26px;color:#8A6428;overflow:hidden;flex:none}
.av-big img{width:100%;height:100%;object-fit:cover}
.lrows{display:grid;gap:10px;margin:14px 0}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px;background:#FCFBF8}
.lrow.hid{opacity:.5}
.lrow .f{display:grid;gap:8px}
.lrow .acts{display:flex;gap:6px}
.lrow .tagh{font-size:11px;font-weight:700;color:var(--bad)}
.limit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.tcard{border:1.5px solid var(--line);border-radius:16px;padding:8px;background:#fff;cursor:pointer;text-align:left;transition:.15s;position:relative}
.tcard:hover{border-color:#B9B1A3}
.tcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;padding:9px 4px 3px;font-weight:700;font-size:14px;gap:6px}
.tcard .lockb{position:absolute;top:14px;right:14px;background:rgba(23,21,31,.85);color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;display:flex;gap:5px;align-items:center;z-index:2}
.mini{height:236px;overflow:hidden;border-radius:11px;pointer-events:none;position:relative;background:#eee}
.mini .scale{transform:scale(.5);transform-origin:top left;width:200%;height:200%;display:flex;flex-direction:column}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2.5px var(--ink)}
input[type=color]{width:42px;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:3px;background:#fff;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .k{font-size:13px;font-weight:700;color:var(--mute)}
.kpi .v{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;margin-top:4px;letter-spacing:-.03em}
.kpi .h{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--mute)}
.bar .b{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--ink);position:relative;min-height:3px}
.bar .b.c{background:var(--acc)}
.bar .pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.bar .pair .b{max-width:20px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:4px 12px;align-items:center;margin-top:12px;font-size:14px}
.hbar .t{height:10px;border-radius:99px;background:#EFEBE3;grid-column:1/-1;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--acc);border-radius:99px}
.hbar .n{text-align:right;font-weight:700}
.locked{position:relative}
.locked .blur{filter:blur(5px);pointer-events:none;user-select:none}
.locked .ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.locked .ov>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 16px 40px rgba(0,0,0,.08);max-width:320px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:13px 14px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:12px 14px;border-bottom:1px solid #F0ECE4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who b{display:block}
.tbl .who small{color:var(--mute)}
.tbl select{border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .inp{max-width:320px}
.note{background:#FFF6E0;border:1px solid #F3E2B5;color:#6E5512;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.switch{position:relative;width:44px;height:26px;border-radius:99px;background:#D9D3C8;border:0;cursor:pointer;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{left:21px}
.switch[disabled]{opacity:.5;cursor:not-allowed}
.rank{display:grid;gap:10px;margin-top:12px}
.rank .r{display:flex;align-items:center;gap:10px}
.rank .r .nm{flex:1;min-width:0}
.rank .r .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .r .nm small{color:var(--mute)}
.dist{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:14px 0 10px;background:#EFEBE3}
.empty{text-align:center;padding:40px 20px}
.empty h3{font-size:22px;margin-bottom:6px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}

/* public page */
.pub{min-height:100vh;display:flex;flex-direction:column}
.pub .bio{flex:1}
.pchip{position:fixed;top:12px;left:12px;z-index:5;background:rgba(23,21,31,.78);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:99px;backdrop-filter:blur(6px)}

/* ===== bio: modelos Espia só ===== */
.bio{--acc:#D9BD8A;flex:1;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:30px 14px 22px;font-family:var(--fb);color:var(--tx);background:var(--pg);-webkit-font-smoothing:antialiased}
.bio.hasbg{background-image:var(--cv);background-size:cover;background-position:center}
.t-azul.hasbg,.t-paisagem.hasbg,.t-imobiliaria.hasbg{background-image:linear-gradient(rgba(8,12,24,.42),rgba(8,12,24,.42)),var(--cv)}
.t-paisagem.hasbg{--cbg:rgba(18,26,38,.30);--bbg:rgba(255,255,255,.14);--mapbg:rgba(18,26,38,.35)}
.t-imobiliaria.hasbg{--cbg:rgba(30,24,40,.40)}
.t-clinica.hasbg,.t-clean.hasbg{background-image:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)),var(--cv)}
.bio a{text-decoration:none;color:inherit}
.bio img{display:block}
.bcard{width:100%;max-width:430px;background:var(--cbg);border:1px solid var(--cbd);border-radius:16px;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--csh);padding:28px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.bhead{display:flex;flex-direction:column;align-items:center;gap:10px}
.bav{width:122px;height:122px;border-radius:50%;border:4px solid var(--ring);overflow:hidden;display:grid;place-items:center;background:var(--avbg);color:var(--acc);font:700 38px/1 var(--ft);flex:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.bav img{width:100%;height:100%;object-fit:cover}
.bav.fit{background:#fff}
.bav.fit img{object-fit:contain;padding:14%}
.blogo{max-width:250px;max-height:96px;object-fit:contain}
.bname{font-family:var(--ft);font-weight:600;font-size:23px;line-height:1.15;color:var(--tt);margin:0}
.bsub{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mt)}
.btext{font-size:14px;line-height:1.5;color:var(--mt);max-width:330px;margin:0 auto}
.bsoc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bsoc a{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--sbg);color:var(--sfg);transition:transform .15s}
.bsoc a:hover{transform:translateY(-2px)}
.bbtns{width:100%;display:grid;gap:12px}
.bbtn{display:flex;align-items:center;gap:13px;padding:11px;border-radius:15px;background:var(--bbg);border:var(--bbd);box-shadow:var(--bsh);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:left;color:var(--btx);transition:transform .15s}
.bbtn:hover{transform:translateY(-2px)}
.bbtn .th{width:60px;height:60px;border-radius:13px;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--thbg);color:var(--thfg)}
.bbtn .th img{width:100%;height:100%;object-fit:cover}
.bbtn .tx{min-width:0}
.bbtn b{display:block;font-family:var(--fb);font-weight:600;font-size:15px;line-height:1.25;color:var(--btt)}
.bbtn small{display:block;font-size:12.5px;line-height:1.38;margin-top:3px;color:var(--btx)}
.bbtn.vazio,.bmap.vazio,.nbtn.vazio{opacity:.6}
.bgal{width:100%}
.bgal h3{font-family:var(--fs);font-weight:500;font-style:var(--gst,normal);font-size:21px;line-height:1.2;color:var(--tt);margin:2px 0 12px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ggrid a{aspect-ratio:3/4;border-radius:13px;overflow:hidden;display:block;background:var(--phbg);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.ggrid.one{grid-template-columns:1fr}
.ggrid.one a{aspect-ratio:4/3}
.ggrid a img,.gcar a img{width:100%;height:100%;object-fit:cover}
.gcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px}
.gcar::-webkit-scrollbar{display:none}
.gcar a{flex:0 0 100%;aspect-ratio:4/3;scroll-snap-align:center;border-radius:14px;overflow:hidden;display:block;background:var(--phbg);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.gdots{display:flex;gap:5px;justify-content:center;margin-top:9px}
.gdots i{width:6px;height:6px;border-radius:50%;background:var(--mt);opacity:.35}
.gdots i:first-child{opacity:1}
.bmap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:140px;width:100%;border-radius:16px;overflow:hidden;padding:18px;text-align:center;color:var(--mapfg);background-color:var(--mapbg);background-image:linear-gradient(32deg,transparent 46%,var(--mapln) 46% 50%,transparent 50%),linear-gradient(-58deg,transparent 60%,var(--mapln) 60% 63%,transparent 63%),repeating-linear-gradient(0deg,transparent 0 30px,var(--mapln2) 30px 32px),repeating-linear-gradient(90deg,transparent 0 44px,var(--mapln2) 44px 46px);box-shadow:var(--bsh);border:var(--bbd);transition:transform .15s}
.bmap:hover{transform:translateY(-2px)}
.bmap::before{content:"";position:absolute;inset:0;background:var(--mapov)}
.bmap>*{position:relative}
.bmap .pin{color:#E5483B;margin-bottom:2px}
.t-azul .bmap>b,.t-azul .bmap>small,.t-paisagem .bmap>b,.t-paisagem .bmap>small,.t-imobiliaria .bmap>b,.t-imobiliaria .bmap>small,.t-executivo .bmap>b,.t-executivo .bmap>small{text-shadow:0 1px 10px rgba(0,0,0,.55)}
.bmap b{font-family:var(--fb);font-weight:700;font-size:29px;line-height:1.05}
.bmap small{font-size:13.5px;line-height:1.35;max-width:260px}
.bfoot{font-size:10.5px;line-height:1.55;color:var(--mt);text-align:center;opacity:.9;font-family:var(--fb)}
.bfoot .es{display:inline-block;margin-top:6px;font-size:11px;opacity:.9}
.bempty{font-size:13px;opacity:.65;padding:14px;border:1.5px dashed currentColor;border-radius:12px;width:100%;text-align:center}
.l-hero{padding:22px 14px}
.bhero{width:100%;max-width:430px;min-height:600px;border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(255,255,255,.08);background:var(--hph);background-size:cover;background-position:center}
.bhero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,32,0) 12%,rgba(4,14,32,.5) 42%,rgba(4,14,32,.93) 100%)}
.bhero-in{text-shadow:0 2px 14px rgba(0,0,0,.35)}
.bhero-in .nbtn{text-shadow:none}
.bhero-ph{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:180px;color:rgba(255,255,255,.12);font:600 120px/1 var(--ft)}
.bhero-in{position:relative;padding:24px 20px 22px}
.heye{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.bhero h1{font-family:var(--ft);font-weight:600;font-size:42px;line-height:1.02;color:#fff;margin:0;word-spacing:4px}
.bhero h1 em{font-style:normal;color:var(--acc)}
.bhero p{color:#fff;font-size:15.5px;line-height:1.35;margin-top:14px}
.nbtns{display:grid;gap:12px;margin-top:30px}
.nbtn{display:block;padding:13px 14px;border-radius:16px;text-align:center;background:color-mix(in srgb,var(--acc) 33%,transparent);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:10px 7px 10px rgba(0,0,0,.3);color:#fff;transition:transform .15s}
.nbtn:hover{transform:translateY(-2px)}
.nbtn:first-child{background:color-mix(in srgb,var(--acc) 96%,transparent);color:#040E20}
.nbtn b{display:block;font-family:var(--ft);font-weight:500;font-size:14px;line-height:1.3;letter-spacing:.05em;text-transform:uppercase}
.nbtn b span{opacity:.7;margin-right:7px}
.nbtn small{display:block;font-family:var(--ft);font-size:13px;line-height:1.3;opacity:.85;margin-top:2px}
.after{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:20px}

.t-executivo{--pg:#040E20;--tx:#fff;--tt:#fff;--mt:rgba(255,255,255,.62);--ft:'Namdhinggo',Georgia,serif;--fb:'Namdhinggo',Georgia,serif;--fs:'Namdhinggo',Georgia,serif;--sbg:rgba(255,255,255,.1);--sfg:#fff;--bbg:rgba(255,255,255,.06);--bbd:1px solid rgba(255,255,255,.14);--bsh:none;--btx:rgba(255,255,255,.7);--btt:#fff;--thbg:rgba(255,255,255,.08);--thfg:var(--acc);--phbg:#13213d;--mapbg:#0c1a33;--mapln:rgba(217,189,138,.35);--mapln2:rgba(255,255,255,.06);--mapov:linear-gradient(transparent,rgba(4,14,32,.35));--mapfg:#fff;--hph:radial-gradient(70% 45% at 50% 32%,#3b4b6e 0%,transparent 70%),linear-gradient(180deg,#1d2c4b,#08142a)}
.t-azul{--pg:repeating-linear-gradient(135deg,#0A1135 0 3px,#0E1A4D 3px 7px);--cbg:linear-gradient(180deg,rgba(9,13,40,.94) 0%,rgba(27,45,140,.92) 100%);--cbd:rgba(255,255,255,.1);--blur:0px;--csh:0 20px 50px rgba(0,0,0,.45);--ring:rgba(255,255,255,.28);--avbg:#0F1B55;--tx:#fff;--tt:#fff;--mt:rgba(255,255,255,.7);--ft:'Roboto Slab',Georgia,serif;--fb:'Roboto',system-ui,sans-serif;--fs:'Roboto Slab',Georgia,serif;--sbg:rgba(255,255,255,.22);--sfg:#fff;--bbg:rgba(255,255,255,.1);--bbd:1px solid rgba(255,255,255,.16);--bsh:0 8px 20px rgba(0,0,0,.25);--btx:rgba(255,255,255,.75);--btt:#fff;--thbg:rgba(255,255,255,.12);--thfg:#fff;--phbg:rgba(255,255,255,.1);--mapbg:#16236b;--mapln:rgba(255,255,255,.22);--mapln2:rgba(255,255,255,.07);--mapov:rgba(10,17,53,.35);--mapfg:#fff}
.t-clinica{--pg:#FFFFFF;--cbg:#fff;--cbd:#F3F0EA;--blur:0px;--csh:0 12px 40px rgba(0,0,0,.08);--ring:#F3E3BF;--avbg:#FFF8EA;--tx:#9C7224;--tt:#9C7224;--mt:#8F6B2C;--ft:'Montserrat',system-ui,sans-serif;--fb:'Montserrat',system-ui,sans-serif;--fs:'Montserrat',system-ui,sans-serif;--sbg:var(--acc);--sfg:#fff;--bbg:#fff;--bbd:1.5px solid color-mix(in srgb,var(--acc) 35%,#fff);--bsh:0 8px 22px rgba(0,0,0,.07);--btx:color-mix(in srgb,var(--acc) 45%,#3a3a3a);--btt:color-mix(in srgb,var(--acc) 82%,#3a2a10);--thbg:#FFF8EA;--thfg:var(--acc);--phbg:#F7EEDC;--mapbg:#FBF5E8;--mapln:color-mix(in srgb,var(--acc) 45%,#fff);--mapln2:rgba(184,134,43,.12);--mapov:rgba(255,255,255,.55);--mapfg:color-mix(in srgb,var(--acc) 70%,#3a2a10)}
.t-paisagem{--pg:radial-gradient(40% 18% at 30% 22%,rgba(255,255,255,.55),transparent 70%),radial-gradient(35% 14% at 75% 40%,rgba(255,236,200,.5),transparent 70%),linear-gradient(180deg,#0E4A68 0%,#3E93B5 38%,#F1B867 74%,#E2733A 100%);--cbg:rgba(255,255,255,.14);--cbd:rgba(255,255,255,.28);--blur:18px;--csh:0 20px 50px rgba(0,0,0,.2);--ring:rgba(255,255,255,.6);--avbg:#fff;--tx:#fff;--tt:#fff;--mt:rgba(255,255,255,.88);--ft:'Montserrat',system-ui,sans-serif;--fb:'Montserrat',system-ui,sans-serif;--fs:'Montserrat',system-ui,sans-serif;--sbg:rgba(255,255,255,.28);--sfg:#fff;--bbg:rgba(255,255,255,.16);--bbd:1px solid rgba(255,255,255,.3);--bsh:0 10px 24px rgba(0,0,0,.15);--btx:rgba(255,255,255,.9);--btt:#fff;--thbg:rgba(255,255,255,.22);--thfg:#fff;--phbg:rgba(255,255,255,.2);--mapbg:rgba(255,255,255,.18);--mapln:rgba(255,255,255,.45);--mapln2:rgba(255,255,255,.12);--mapov:transparent;--mapfg:#fff}

/* hero escuro com palco */
.dark-hero{position:relative;background:radial-gradient(55% 65% at 76% 45%,rgba(204,153,68,.24),transparent 62%),radial-gradient(45% 55% at 8% 0%,rgba(255,255,255,.06),transparent 60%),linear-gradient(180deg,#1B1A1B,#141314);color:#fff;border-radius:0 0 40px 40px;overflow:hidden}
.dark-hero .logo{color:#fff}
.dark-hero .nav nav a.t{color:rgba(255,255,255,.72)}
.dark-hero .nav nav a.t:hover{color:#fff}
.dark-hero .hero{padding-bottom:90px}
.dark-hero .hero h1{color:#fff}
.dark-hero .hero h1 em{color:#E4B05D}
.dark-hero .hero p.lead{color:rgba(255,255,255,.72)}
.dark-hero .eyebrow{color:#E4B05D}
.dark-hero .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.dark-hero .btn.ghost:hover{box-shadow:inset 0 0 0 1.5px #fff}
.dark-hero .hero .proof{color:rgba(255,255,255,.6)}
.dark-hero .hero .proof b{color:#fff}
.gl{position:absolute;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;width:286px;background:linear-gradient(135deg,rgba(72,66,66,.62),rgba(28,26,28,.52));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 24px 50px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;z-index:6;animation:glfloat 7s ease-in-out infinite}
.gl .gi{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#AC7E37,#E4B05D 55%,#BD8E47);display:grid;place-items:center;color:#232122;flex:none;box-shadow:0 6px 14px rgba(172,126,55,.45)}
.gl .gt{min-width:0;flex:1}
.gl b{display:block;font-size:14px;font-weight:600}
.gl small{display:block;font-size:12px;line-height:1.35;color:rgba(255,255,255,.74)}
.gl em{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.55);align-self:flex-start}
.gl .up{color:#7DDBA6;font-weight:700}
.gl.g1{top:-6px;left:-70px;animation-delay:-1s}
.gl.g3{top:96px;right:-80px;bottom:auto;animation-delay:-5s}
.lap-in{width:100%;height:100%;display:grid;grid-template-columns:64px 1fr;color:#232122;background:#F6F2EA}
.lp-side{background:#232122;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.lp-side .lsym{height:30px;color:#fff}
.lp-side i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.lp-side i.on{background:#CC9944}
.lp-main{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lp-eye{font:600 7px/1 Montserrat,sans-serif;letter-spacing:.2em;color:#AC7E37}
.lp-h{font:400 19px/1 'Instrument Serif',Georgia,serif}
.lp-k{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lp-k div{background:#fff;border:1px solid #E8DFCF;border-radius:7px;padding:7px 8px}
.lp-k small{display:block;font:600 6.5px Montserrat,sans-serif;color:#7E797A}
.lp-k b{display:block;font:400 17px 'Instrument Serif',Georgia,serif;margin-top:2px}
.lp-c{flex:1;background:#fff;border:1px solid #E8DFCF;border-radius:7px;padding:9px;display:flex;align-items:flex-end;gap:7px}
.lp-c span{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.lp-c span i{flex:1;border-radius:3px 3px 1px 1px;background:#373435}
.lp-c span i+i{background:linear-gradient(180deg,#E4B05D,#AC7E37)}
.stage{position:relative;height:680px;perspective:1800px;perspective-origin:50% 40%}
.stage::after{content:"";position:absolute;left:4%;right:0;bottom:-10px;height:70px;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.6),transparent 70%);filter:blur(8px);z-index:0}
/* MacBook */
.mb{position:absolute;left:50%;top:36px;width:500px;margin-left:-250px;transform-style:preserve-3d;z-index:1}
.mb-lid{position:relative;width:500px;height:318px;background:#0d0d0e;border-radius:18px 18px 4px 4px;padding:11px 11px 14px;box-shadow:inset 0 0 0 1.5px #6a6a70,inset 0 0 0 3px #1c1c1e,0 30px 60px rgba(0,0,0,.45)}
.mb-scr{position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;background:#F6F2EA}
.mb-scr::after,.iph .scr::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 32%,rgba(255,255,255,0) 48%);pointer-events:none;z-index:5}
.mb-notch{position:absolute;top:11px;left:50%;width:74px;height:13px;transform:translateX(-50%);background:#0d0d0e;border-radius:0 0 9px 9px;z-index:6}
.mb-notch::after{content:"";position:absolute;top:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#1f2a44}
.mb-deck{position:absolute;left:-26px;right:-26px;top:315px;height:98px;transform-style:flat}
.mb-surf{position:absolute;left:0;right:0;top:0;height:230px;transform-origin:top center;transform:perspective(1400px) rotateX(72deg);background:linear-gradient(180deg,#a9a9ae 0%,#cfcfd3 12%,#d9d9dd 60%,#c7c7cc 100%);border-radius:3px 3px 18px 18px;box-shadow:inset 0 3px 0 #77777c}
.mb-keys{position:absolute;left:48px;right:48px;top:20px;height:112px;border-radius:6px;background:#1d1d20;padding:5px;display:grid;grid-template-columns:repeat(14,1fr);grid-auto-rows:1fr;gap:3px}
.mb-keys i{background:#0e0e10;border-radius:2px;box-shadow:inset 0 -1px 0 #3a3a3e}
.mb-pad{position:absolute;left:50%;top:144px;width:200px;height:74px;transform:translateX(-50%);border-radius:8px;background:linear-gradient(180deg,#c6c6cb,#bbbbc0);box-shadow:inset 0 0 0 1px #a2a2a8}
.mb-front{position:absolute;left:-40px;right:-40px;top:398px;height:11px;background:linear-gradient(180deg,#e0e0e4,#8a8a90);border-radius:0 0 16px 16px}
.mb-front::before{content:"";position:absolute;left:50%;top:0;width:110px;height:4px;transform:translateX(-50%);background:#9a9aa0;border-radius:0 0 8px 8px}
/* iPhone 3D */
.iph{position:absolute;width:224px;height:462px;transform-style:preserve-3d;z-index:3}
.iph .lay{position:absolute;inset:0;border-radius:46px;background:linear-gradient(90deg,#2c2c30,#8e8e94 22%,#4b4b50 50%,#9d9da3 78%,#2c2c30)}
.iph .face{position:absolute;inset:0;border-radius:46px;background:#060607;padding:9px;transform:translateZ(1px);box-shadow:inset 0 0 0 1.5px #77777d,inset 0 0 0 3px #111}
.iph .scr{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff}
.iph .isl{position:absolute;top:11px;left:50%;width:76px;height:22px;transform:translateX(-50%);border-radius:20px;background:#000;z-index:6}
.iph .isl::after{content:"";position:absolute;right:12px;top:7px;width:8px;height:8px;border-radius:50%;background:#14203a}
.iph .btn-s{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#5d5d62,#a5a5aa)}
.iph .sc{position:absolute;top:0;left:0;width:390px;height:850px;transform-origin:top left;transform:scale(.5333)}
.iph .sc>.bio{min-height:850px}
.iph.pa{left:-44px;top:150px;transform:rotateY(22deg) rotateX(4deg) rotateZ(-5deg)}
.iph.pb{right:-44px;left:auto;top:180px;transform:rotateY(-22deg) rotateX(4deg) rotateZ(5deg);z-index:4}
.fshadow{position:absolute;width:200px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(16px);z-index:0}
/* perfil social genérico */
.ig{width:390px;height:850px;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Montserrat,sans-serif;font-size:14px}
.ig-st{display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0;font-weight:600;font-size:15px;height:50px}
.ig-st span:last-child{display:flex;gap:6px;align-items:center}
.ig-st i{display:block;width:18px;height:10px;border-radius:3px;border:1.5px solid #111}
.ig-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;font-size:20px}
.ig-row{display:flex;align-items:center;gap:22px;padding:6px 16px}
.ig-av{width:88px;height:88px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#AC7E37,#E4B05D,#BD8E47);flex:none}
.ig-av span{display:block;width:100%;height:100%;border-radius:50%;border:3px solid #fff;background-size:cover;background-position:center 30%}
.ig-num{flex:1;display:flex;justify-content:space-between;text-align:center}
.ig-num b{display:block;font-size:17px}
.ig-num small{font-size:13px;color:#333}
.ig-bio{padding:10px 16px 0;line-height:1.38}
.ig-bio b{display:block}
.ig-bio .cat{color:#737373}
.ig-link{display:inline-flex;align-items:center;gap:5px;color:#00376B;font-weight:600;margin-top:3px;background:linear-gradient(transparent 60%,rgba(228,176,93,.45) 60%);padding:0 2px}
.ig-btns{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;padding:12px 16px}
.ig-btns span{background:#EFEFEF;border-radius:8px;text-align:center;padding:8px 0;font-weight:600;font-size:14px}
.ig-hl{display:flex;gap:16px;padding:6px 16px 12px}
.ig-hl div{text-align:center;font-size:12px}
.ig-hl i{display:block;width:62px;height:62px;border-radius:50%;border:1px solid #DBDBDB;padding:3px;margin-bottom:4px;background-clip:content-box}
.ig-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #DBDBDB;height:44px}
.ig-tabs span:first-child{border-bottom:1.5px solid #111}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ig-grid i{aspect-ratio:4/5;display:block;background-size:cover;background-position:center}
@keyframes glfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.gl{animation:none}}
@media (max-width:1180px){.mb{transform:scale(.88)}.gl.g1{left:-20px}.gl.g3{right:-20px}}
@media (max-width:860px){
  .dark-hero{border-radius:0 0 28px 28px}
  .stage{height:520px;max-width:390px;margin:10px auto 0;width:100%}
  .mb{display:none}
  .iph.pa{left:-10px;top:30px}.iph.pb{left:auto;right:-10px;top:70px}
  .gl{width:220px;padding:10px 12px}.gl .gi{width:36px;height:36px}
  .gl.g1{top:-6px;right:-6px;left:auto}.gl.g3{bottom:0;right:-6px}
}

/* períodos e planos */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:22px}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.plans.two-col{grid-template-columns:repeat(2,minmax(0,440px))}
.plan .tot{font-size:14px;color:var(--mute);margin-top:4px}
.plan.hl .tot{color:#C9C2B8}
.ppick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ppick.per{grid-template-columns:repeat(3,1fr)}
.ppick label{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;background:#fff;display:block}
.ppick input{display:none}
.ppick label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ppick b{display:block;font-size:15px}
.ppick small{color:var(--mute);font-size:12.5px}
.sumbox{background:#fff;border:1px dashed #D9CDB5;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.sumbox b{font-family:'Instrument Serif',Georgia,serif;font-size:20px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pgrid button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.pgrid button b{display:block}
.pgrid button small{color:var(--mute)}
.pgrid button.cur{border-color:var(--ink);background:var(--ink);color:#fff}
.pgrid button.cur small{color:#C9C2B8}
@media (max-width:860px){.plans.two-col{grid-template-columns:1fr}.ppick.per,.pgrid{grid-template-columns:1fr 1fr 1fr}}

.gadd:hover{border-color:var(--ink)}
.tnum{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.08em}
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .app .prev{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding:30px 16px}
}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .stack{height:520px;max-width:420px;margin:0 auto;width:100%}
  .ph:nth-child(1),.ph:nth-child(3){display:none}
  .steps,.plans,.two{grid-template-columns:1fr}
  .nav nav a.t{display:none}
  .auth{grid-template-columns:1fr}
  .auth .r{display:none}
  .app,.app.adm{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:2px}
  .side .logo{padding:0 10px 0 4px}
  .side .role{display:none}
  .side .logo svg{height:40px}
  .side a.tab{padding:9px 11px;white-space:nowrap;font-size:14px}
  .sfoot{margin:0 0 0 auto;display:flex;gap:12px;white-space:nowrap;padding:0 6px}
  .sfoot .mode{display:none}
  .lrow{grid-template-columns:64px 1fr}
  .lrow .acts{grid-column:1/-1;justify-content:flex-end}
  .frow,.imggrid,.socg{grid-template-columns:1fr}
  .mhead h2{font-size:28px}
}
</style>
</head>

/* ---------- persistência ---------- */
function persistLocal(){if(S.mode!=='local')return;try{localStorage.setItem('espiaso-data',JSON.stringify({pages:S.pages,stats:S.stats,config:S.config}));}catch(e){toast('O navegador ficou sem espaço para salvar.');}writeMediaLocal(true);}
const writers={};
function queueWrite(path,data,del){const w=writers[path]||(writers[path]={busy:false,next:null});w.next={data,del};if(!w.busy)flush(path);}
async function flush(path){
  const w=writers[path];if(!w.next){return}
  const job=w.next;w.next=null;w.busy=true;setSaving(true);
  let tries=0;
  while(true){
    try{ if(job.del) await S.db.doc(path).delete(); else await S.db.doc(path).set(job.data); break; }
    catch(e){
      const c=e&&e.code;
      if(c==='unavailable'&&tries<1){tries++;await new Promise(r=>setTimeout(r,400+Math.random()*600));continue;}
      if(c==='invalid_argument'){S.readonly=true;toast('Você só pode visualizar este protótipo. Peça acesso de Colaborador para salvar.');}
      else if(c==='quota_exceeded'){toast('O banco do protótipo está cheio. Exclua páginas antigas no painel ADM.');}
      else if(c==='revoked'){S.readonly=true;}
      else toast('Não foi possível salvar agora. Tente de novo.');
      break;
    }
  }
  w.busy=false;
  if(w.next)flush(path);
  else{ if(path.startsWith('pages/'))delete dirty[path.slice(6)]; if(!Object.values(writers).some(x=>x.busy||x.next))setSaving(false);}
}
function writeDoc(path,data){
  if(S.mode==='local'){persistLocal();return;}
  if(S.mode!=='cloud'||S.readonly)return;
  queueWrite(path,data,false);
}
function delDoc(path){
  if(S.mode==='local'){persistLocal();return;}
  if(S.mode!=='cloud'||S.readonly)return;
  queueWrite(path,null,true);
}
const timers={};
function savePage(p,delay){
  S.pages[p.slug]=p;dirty[p.slug]=true;
  clearTimeout(timers[p.slug]);
  if(S.mode==='cloud'&&!S.readonly)setSaving(true);
  timers[p.slug]=setTimeout(()=>{writeDoc('pages/'+p.slug,clone(p));if(S.mode==='local'){delete dirty[p.slug];}},delay==null?0:delay);
  refreshLive();
}
function removePage(slug){const p=S.pages[slug];delete S.pages[slug];delete S.stats[slug];if(S.mode==='local')persistLocal();else{delDoc('pages/'+slug);delDoc('stats/'+slug);if(p)mediaIds(p).forEach(id=>delDoc('media/'+id));}refreshLive();}
function saveConfig(){writeDoc('config/app',clone(S.config));refreshLive();}
function bump(slug,linkId){
  if(S.readonly||!S.pages[slug])return;
  const st=clone(S.stats[slug]||emptyStats());st.links=st.links||{};st.days=st.days||{};
  const d=today();st.days[d]=st.days[d]||{v:0,c:0};
  if(linkId){st.clicks=(st.clicks||0)+1;st.links[linkId]=(st.links[linkId]||0)+1;st.days[d].c++;}
  else{st.views=(st.views||0)+1;st.days[d].v++;}
  const ks=Object.keys(st.days).sort();while(ks.length>30)delete st.days[ks.shift()];
  S.stats[slug]=st;writeDoc('stats/'+slug,st);
}
function setSaving(v){S.saving=v;updateLive('save');}

function startLocal(){
  S.mode='local';
  try{const d=JSON.parse(lsGet('espiaso-data')||'null');if(d){S.pages={};Object.entries(d.pages||{}).forEach(([k,v])=>{S.pages[k]=normPage(v);});S.stats=d.stats||{};S.config=d.config||{};}}catch(e){}
  try{S.media=JSON.parse(lsGet('espiaso-media')||'{}')||{};}catch(e){S.media={};}
  S.loaded=true;rerender();
}
async function init(){
  window.addEventListener('hashchange',route);
  route();
  if(!window.claude||typeof window.claude.use!=='function'){startLocal();return;}
  let db=null;
  try{db=await window.claude.use('db');}catch(e){db=null;}
  if(!db){startLocal();return;}
  S.db=db;S.mode='cloud';
  const got={pages:false,stats:false,config:false};
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;updateLive('loading');}},10000);
  const done=k=>{got[k]=true;if(got.pages&&got.stats&&got.config&&!S.loaded){S.loaded=true;S.slow=false;clearTimeout(timer);rerender();}else refreshLive();};
  const fail=k=>e=>{if(e&&e.code==='revoked')S.readonly=true;done(k);};
  db.collection('pages').onSnapshot(snap=>{
    const np={};snap.docs.forEach(d=>{const v=d.data();if(!v)return;np[d.id]=(dirty[d.id]&&S.pages[d.id])?S.pages[d.id]:normPage(clone(v));});
    Object.keys(dirty).forEach(k=>{if(!np[k]&&S.pages[k])np[k]=S.pages[k];});
    S.pages=np;
    if(!snap.metadata.fromCache)done('pages');else refreshLive();
  },fail('pages'));
  db.collection('stats').onSnapshot(snap=>{
    const ns={};snap.docs.forEach(d=>{const v=d.data();if(v)ns[d.id]=clone(v);});
    S.stats=ns;if(!snap.metadata.fromCache)done('stats');else refreshLive();
  },fail('stats'));
  db.doc('config/app').onSnapshot(snap=>{
    S.config=snap.exists?clone(snap.data()):{};
    if(!snap.metadata.fromCache)done('config');else refreshLive();
  },fail('config'));
}

function normUrl(l){
  let u=String(l.url||'').trim();if(!u)return '';
  const t=l.type;
  if(t==='whatsapp'&&!/^https?:/i.test(u)){const d=u.replace(/\D/g,'');if(d.length<10)return '';let r='https://wa.me/'+(d.length<=11?'55'+d:d);if(l.msg&&String(l.msg).trim())r+='?text='+encodeURIComponent(String(l.msg).trim());return r;}
  if(t==='telefone'&&!/^tel:/i.test(u)){const d=u.replace(/\D/g,'');return d.length>=8?'tel:+'+(d.length<=11?'55'+d:d):'';}
  if(t==='email'&&u.includes('@')&&!/^(mailto:|https?:)/i.test(u))return 'mailto:'+u;
  if(t==='instagram'&&!/^https?:/i.test(u)&&!/\.[a-z]{2,}\//i.test(u))return 'https://instagram.com/'+encodeURIComponent(u.replace(/^@/,''));
  if(t==='tiktok'&&!/^https?:/i.test(u)&&!/\.[a-z]{2,}\//i.test(u))return 'https://www.tiktok.com/@'+encodeURIComponent(u.replace(/^@/,''));
  if(t==='facebook'&&!/^https?:/i.test(u)&&!/\./.test(u))return 'https://facebook.com/'+encodeURIComponent(u.replace(/^@/,''));
  if(/^(https?:|mailto:|tel:)/i.test(u))return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';
  return 'https://'+u;
}

let lgRAF=0;
function initLogos(){cancelAnimationFrame(lgRAF);const v=$('#lgs');if(!v)return;const t=v.firstElementChild;
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=t.scrollWidth/3,x=-W,last=0,hover=false,drag=false,sx=0,so=0,moved=0;
  const wrap=()=>{if(W<=0)return;while(x>=0)x-=W;while(x<-W)x+=W;};
  const put=()=>{t.style.transform=`translate3d(${x.toFixed(1)}px,0,0)`;};
  v.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true;});
  v.addEventListener('pointerleave',()=>{hover=false;});
  const mv=e=>{if(!drag)return;const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));x=so+dx;wrap();put();};
  const up=()=>{drag=false;v.classList.remove('drag');removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);};
  v.addEventListener('pointerdown',e=>{if(e.button)return;drag=true;moved=0;sx=e.clientX;so=x;v.classList.add('drag');addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);});
  v.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault();moved=0;}},true);
  v.addEventListener('dragstart',e=>e.preventDefault());
  addEventListener('resize',()=>{W=t.scrollWidth/3;wrap();},{passive:true});
  const step=ts=>{if(!document.body.contains(v))return;const dt=last?Math.min(50,ts-last):0;last=ts;if(!drag&&!hover&&!red)x+=0.042*dt;wrap();put();lgRAF=requestAnimationFrame(step);};
  put();lgRAF=requestAnimationFrame(step);}

  els.forEach(e=>io.observe(e));}

function tabPagina(p){

function linksBox(p){

      <div class="f">
        <div class="frow"><select class="inp" data-lf="type" data-i="${i}">${Object.entries(LTYPES).map(([k,v])=>`<option value="${k}"${k===l.type?' selected':''}>${v.n}</option>`).join('')}</select><input class="inp" data-lf="label" data-i="${i}" maxlength="50" value="${esc(l.label)}" placeholder="Título do botão"></div>
        <input class="inp" data-lf="desc" data-i="${i}" maxlength="100" value="${esc(l.desc)}" placeholder="Descrição curta">

        ${l.type==='whatsapp'?`<textarea class="inp" data-lf="msg" data-i="${i}" maxlength="300" rows="2" style="min-height:58px" placeholder="Mensagem que já chega escrita no WhatsApp">${esc(l.msg)}</textarea>`:''}
        ${th?`<button class="linkbtn" data-act="thumb-del" data-i="${i}">Remover foto</button>`:''}

      </div>
      <div class="acts"><button class="iconbtn" title="Subir" data-act="lk-up" data-i="${i}"${i===0?' disabled':''}>${ic('up',16)}</button><button class="iconbtn" title="Descer" data-act="lk-down" data-i="${i}"${i===n-1?' disabled':''}>${ic('down',16)}</button><button class="iconbtn del" title="Excluir" data-act="lk-del" data-i="${i}">${ic('x',16)}</button></div>
    </div>`;}).join('');

  ${full?`<button class="btn acc sm" data-act="upgrade" data-plan="pro">${ic('lock',15)}Liberar botões ilimitados</button>`:`<button class="btn sm" data-act="lk-add">${ic('plus',15)}Adicionar botão</button>`}</div>`;
}
function galBox(p){

  <div class="galed">${g.items.map((it,i)=>{const im=src(it.img);const hid=i>=max;return `<div class="gitem${hid?' hid':''}"><div class="im">${im?`<img src="${im}" alt="">`:''}<button class="gx" data-act="gal-del" data-i="${i}" title="Remover foto">${ic('x',14)}</button>${hid?'<span class="gh">Oculta no Grátis</span>':''}</div><input class="inp" data-gal="url" data-i="${i}" maxlength="300" value="${esc(it.url)}" placeholder="Link (opcional)"></div>`;}).join('')}

}
function tabAparencia(p){
  return `<div class="stackc">
  <div class="card"><h3>Modelo</h3><p class="sub">Seis modelos na linha das páginas que já estão no ar. Toque para aplicar.</p>

function tgrid(p){
  const pl=planOf(p);const off=tplOff();const on=effTpl(p).id;
  return TPL.filter(t=>t.id===BASE||!off.includes(t.id)).map(t=>{const lock=t.pro&&!pl.pro;
    return `<button class="tcard${t.id===on?' on':''}" data-act="tpl" data-id="${t.id}">${lock?`<span class="lockb">${ic('lock',12)}Pro</span>`:''}${mini(p,t.id)}<div class="meta"><span><span class="tnum">MODELO ${t.n}</span><br>${t.name}</span>${t.id===on?'<span class="pill dark">Em uso</span>':t.pro?'<span class="pill pro">Pro</span>':''}</div></button>`;}).join('');
}
function swatches(p){
  const t=effTpl(p);const acc=(p.accent||t.acc).toUpperCase();
  return SWATCHES.map(c=>`<button class="swatch${c.toUpperCase()===acc?' on':''}" style="background:${c}" data-act="accent" data-c="${c}" title="${c}"></button>`).join('')+
  `<input type="color" value="${/^#[0-9a-f]{6}$/i.test(acc)?acc:'#D9BD8A'}" data-accpick title="Escolher outra cor">`+
  (p.accent?`<button class="btn ghost sm" data-act="accent-reset">Usar cor do modelo</button>`:'');
}
function last7(){const out=[];const d=new Date();for(let i=6;i>=0;i--){const x=new Date(d.getTime()-i*864e5);out.push({k:isoDay(x),l:x.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')});}return out;}
LIVE.metrics=()=>{
  const p=cur();if(!p)return '';const st=S.stats[p.slug]||emptyStats();const pl=planOf(p);
  const v=st.views||0,c=st.clicks||0,ctr=v?Math.round(c/v*100):0;
  const days=last7().map(d=>Object.assign(d,(st.days||{})[d.k]||{v:0,c:0}));
  const mx=Math.max(1,...days.map(d=>Math.max(d.v,d.c)));
  const lm=Math.max(1,...p.links.map(l=>(st.links||{})[l.id]||0));
  const detail=`<div class="two">
    <div class="card"><h3>Últimos 7 dias</h3><div class="legend"><span><i style="background:var(--ink)"></i>Visitas</span><span><i style="background:var(--acc)"></i>Cliques</span></div>
      <div class="bars">${days.map(d=>`<div class="bar"><div class="pair"><div class="b" style="height:${d.v/mx*100}%" title="${d.v} visitas"></div><div class="b c" style="height:${d.c/mx*100}%" title="${d.c} cliques"></div></div><span>${d.l}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Cliques por botão</h3>${p.links.length?p.links.map(l=>{const n=(st.links||{})[l.id]||0;return `<div class="hbar"><span>${esc(l.label||'Sem título')}</span><span class="n">${num(n)}</span><div class="t"><i style="width:${n/lm*100}%"></i></div></div>`;}).join(''):'<p class="sub" style="margin-top:10px">Adicione botões para ver os cliques.</p>'}</div></div>`;
  return `<div class="stackc"><div class="kpis">
    <div class="kpi"><div class="k">Visitas</div><div class="v">${num(v)}</div><div class="h">desde a criação</div></div>
    <div class="kpi"><div class="k">Cliques</div><div class="v">${num(c)}</div><div class="h">em todos os links</div></div>
    <div class="kpi"><div class="k">Taxa de clique</div><div class="v">${ctr}%</div><div class="h">cliques por visita</div></div></div>
    ${pl.full?detail:`<div class="locked"><div class="blur">${detail}</div><div class="ov"><div><h3 style="font-size:20px;margin-bottom:6px">Métricas detalhadas no Pro</h3><p class="sub" style="margin-bottom:14px">Veja qual botão vende mais e em que dia sua página bomba.</p><button class="btn acc" data-act="upgrade" data-plan="pro">Assinar o Pro</button></div></div></div>`}
    <p class="sub">No protótipo, cada abertura da sua página pública conta como visita e cada toque num botão conta como clique.</p></div>`;
};
LIVE.plan=()=>{
  const p=cur();if(!p)return '';const cp=planOf(p);const cm=periodOf(p);
  return `<div class="stackc"><div class="card"><div class="sub">Seu plano atual</div><h3 style="font-size:28px;margin:4px 0 6px">${esc(cp.name)} <span class="sub" style="font-size:16px;font-weight:500">${brl(cp.price)}/mês</span></h3>
    <p class="sub">Período de ${cm} meses: <b style="color:var(--ink)">${brl(totalOf(cp.price,cm))}</b> · válido até <b style="color:var(--ink)">${fmtDate(p.paidUntil)}</b></p></div>
  ${['pro','agencia'].map(k=>{const pl=planOf({plan:k});return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h3>${pl.name} <span class="sub" style="font-weight:500">${brl(pl.price)}/mês</span></h3><p class="sub">${pl.tag}</p></div></div>
    <div class="pgrid">${PERIODS.map(m=>{const isCur=k===cp.id&&m===cm;return `<button class="${isCur?'cur':''}" ${isCur?'disabled':`data-act="upgrade" data-plan="${k}" data-m="${m}"`}><b>${m} meses</b><small>${isCur?'Plano atual':brl(totalOf(pl.price,m))}</small></button>`;}).join('')}</div></div>`;}).join('')}
  </div>`;
};

function kpisAdm(){
  const ps=Object.values(S.pages);const act=ps.filter(p=>p.status!=='suspenso');
  const mrr=act.reduce((a,p)=>a+planOf(p).price,0);const tot=act.reduce((a,p)=>a+totalOf(planOf(p).price,periodOf(p)),0);
  let v=0,c=0;ps.forEach(p=>{const st=S.stats[p.slug];if(st){v+=st.views||0;c+=st.clicks||0;}});
  return `<div class="kpis">
   <div class="kpi"><div class="k">Clientes</div><div class="v">${num(ps.length)}</div><div class="h">${num(act.length)} ativos</div></div>
   <div class="kpi"><div class="k">Receita mensal (MRR)</div><div class="v">${brl(mrr)}</div><div class="h">soma das mensalidades ativas</div></div>
   <div class="kpi"><div class="k">Valor contratado</div><div class="v">${brl(tot)}</div><div class="h">soma dos períodos de 3, 6 e 12 meses</div></div>
   <div class="kpi"><div class="k">Visitas nas páginas</div><div class="v">${num(v)}</div><div class="h">${num(c)} cliques em botões</div></div></div>`;
}

LIVE.importbar=()=>{if(S.mode!=='cloud'||!S.loaded||S.readonly||lsGet('espiaso-imported')==='1')return '';const b=localBackup();if(!b)return '';const n=b.pend.length;return `<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#F3E8D2;border-color:#E4CFA4;color:#5E4416"><span>Encontramos ${n} ${n===1?'página salva':'páginas salvas'} só neste navegador, de antes da nuvem.</span><span style="display:flex;gap:8px"><button class="btn ghost sm" data-act="imp-skip">Ignorar</button><button class="btn acc sm" data-act="imp-go">Enviar para a nuvem</button></span></div>`;};

function slugify(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,30);}
function createPage(o){
  const slug=String(o.slug||'').trim().toLowerCase();
  if(!o.name||!o.name.trim())return 'Informe o nome.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email||''))return 'Informe um e-mail válido.';
  if(!/^[a-z0-9](?:[a-z0-9-]{1,28}[a-z0-9])$/.test(slug))return 'O endereço precisa ter de 3 a 30 letras minúsculas ou números, sem espaços.';
  if(RESERVED.includes(slug))return 'Esse endereço é reservado. Escolha outro.';
  if(S.pages[slug])return 'Esse endereço já está em uso. Tente outro.';
  if(Object.values(S.pages).some(p=>(p.email||'').toLowerCase()===o.email.trim().toLowerCase())&&!o.allowDupEmail)return 'Já existe uma página com esse e-mail. Use Entrar.';
  if(S.readonly||(S.mode!=='cloud'&&S.mode!=='local'))return 'Não é possível salvar neste acesso.';
  const p=normPage({slug,name:o.name.trim(),email:o.email.trim(),template:o.template||BASE,plan:PLANS[o.plan]?o.plan:'pro',period:PERIODS.includes(+o.period)?+o.period:3,createdAt:Date.now(),headline:'Escolha como deseja começar',
    links:[{id:uid(),type:'whatsapp',label:'Atendimento no WhatsApp',desc:LTYPES.whatsapp.d,url:'',msg:'Olá! Vim pelo seu Instagram e gostaria de mais informações.'},{id:uid(),type:'mapa',label:'Google Maps',desc:LTYPES.mapa.d,url:''}]});
  savePage(p,0);return null;
}
function seed(){
  const now=Date.now();const ds=last7();

    const p=normPage(Object.assign({status:'ativo',createdAt:now-ago*864e5},o,{links:o.links.map(([type,label,desc,url,msg])=>({id:uid(),type,label,desc,url,msg:msg||''}))}));
    const st={views:v,clicks:c,links:{},days:{}};
    let rv=v,rc=c;ds.forEach((d,i)=>{const f=i===6?rv:Math.round(v*(.08+Math.random()*.08));const g=i===6?rc:Math.round(c*(.08+Math.random()*.08));const fv=Math.max(0,Math.min(rv,f)),fc=Math.max(0,Math.min(rc,g));st.days[d.k]={v:fv,c:fc};rv-=fv;rc-=fc;});
    let left=c;p.links.forEach((l,i)=>{const n=i===p.links.length-1?left:Math.round(left*(.45+Math.random()*.15));st.links[l.id]=n;left-=n;});
    S.pages[p.slug]=p;S.stats[p.slug]=st;writeDoc('pages/'+p.slug,clone(p));writeDoc('stats/'+p.slug,clone(st));

  const t=e.target;
  if(t.dataset.bind){const p=cur();if(!p)return;p[t.dataset.bind]=t.value;if(t.dataset.bind==='bio'){const c=$('#bio-c');if(c)c.textContent=t.value.length+'/180';}savePage(p,600);return;}
  if(t.dataset.lf&&t.dataset.lf!=='type'){const p=cur();const l=p&&p.links[+t.dataset.i];if(!l)return;l[t.dataset.lf]=t.value;savePage(p,600);return;}
  if(t.dataset.soc){const p=cur();if(!p)return;p.social=Object.assign({},p.social);p.social[t.dataset.soc]=t.value;savePage(p,600);return;}
  if(t.dataset.gal){const p=cur();if(!p)return;if(t.dataset.gal==='title')p.gallery.title=t.value;else{const it=p.gallery.items[+t.dataset.i];if(it)it.url=t.value;}savePage(p,600);return;}
  if(t.hasAttribute('data-accpick')){const p=cur();p.accent=t.value;savePage(p,400);return;}
  if(t.id==='adm-q'){S.admQ=t.value;updateLive('clients');return;}
  if(t.hasAttribute('data-slugsrc')){const f=t.form;const dst=f&&f.querySelector('[data-slugdst]');if(dst&&!dst.dataset.touched)dst.value=slugify(t.value);return;}
  if(t.hasAttribute('data-slugdst')){t.dataset.touched='1';const v=t.value.toLowerCase().replace(/[^a-z0-9-]/g,'');if(v!==t.value)t.value=v;}
});
let WEBP=false;try{WEBP=document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp');}catch(e){}
const UPCFG={avatar:{max:320,square:true,alpha:true},logo:{max:520,alpha:true},cover:{max:1100,q:.76},thumb:{max:180,square:true},gal:{max:820,q:.78}};
function hasAlpha(file){return new Promise(res=>{if(!/png|webp|gif/i.test(file.type)){res(false);return;}const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const w=c.width=Math.min(64,img.naturalWidth),h=c.height=Math.min(64,img.naturalHeight);const g=c.getContext('2d');g.drawImage(img,0,0,w,h);const d=g.getImageData(0,0,w,h).data;let t=0;for(let i=3;i<d.length;i+=4)if(d[i]<250)t++;URL.revokeObjectURL(url);res(t>w*h*0.04);};img.onerror=()=>{URL.revokeObjectURL(url);res(false);};img.src=url;});}
function readImg(file,o){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;
    if(o.square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=Math.min(m,o.max);}else{const k=Math.min(1,o.max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);}
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
    const type=o.alpha?(WEBP?'image/webp':'image/png'):'image/jpeg';
    if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,w,h);}
    g.drawImage(img,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL(type,o.q||.82));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.lf==='type'){const p=cur();const l=p&&p.links[+t.dataset.i];if(!l)return;const old=LTYPES[l.type];const nw=LTYPES[t.value];l.type=t.value;
    if(!l.label||(old&&(l.label===old.n||l.label==='Novo botão')))l.label=nw.n;if(!l.desc||(old&&l.desc===old.d))l.desc=nw.d;savePage(p);relinks();return;}
  if(t.hasAttribute('data-accpick')){const p=cur();$('#sw').innerHTML=swatches(p);$('#tgrid').innerHTML=tgrid(p);return;}
  if(t.dataset.chg==='adm-period'){const p=S.pages[t.dataset.slug];if(!p)return;p.period=+t.value;p.paidUntil=addMonths(Date.now(),p.period);savePage(p);t.blur();toast('Período de '+p.name+' alterado para '+p.period+' meses');return;}
  if(t.form&&t.form.dataset.form==='signup'&&(t.name==='plan'||t.name==='period')){const fd=new FormData(t.form);const sb=$('#sumbox');if(sb)sb.innerHTML=signSummary(fd.get('plan'),+fd.get('period'));S.signPlan=fd.get('plan');S.per=+fd.get('period');return;}
  if(t.dataset.chg==='adm-plan'){const p=S.pages[t.dataset.slug];if(!p)return;p.plan=t.value;savePage(p);t.blur();toast('Plano de '+p.name+' alterado para '+planOf(p).name);return;}
  if(t.dataset.up){
    const kind=t.dataset.up;const files=[...(t.files||[])].filter(f=>/^image\//.test(f.type));const idx=t.dataset.i;t.value='';
    if(!files.length){toast('Escolha uma imagem');return;}
    const p=cur();if(!p)return;
    try{
      if(kind==='gal'){const room=Math.max(0,planOf(p).gal-p.gallery.items.length);
        for(const f of files.slice(0,room)){const d=await readImg(f,UPCFG.gal);const id=saveMedia(d);if(!id)break;p.gallery.items.push({id:uid(),img:id,url:''});}
        if(files.length>room)toast('Seu plano permite '+planOf(p).gal+' fotos na galeria');
        savePage(p);const gb=$('#gal-box');if(gb)gb.innerHTML=galBox(p);return;}
      const d=await readImg(files[0],UPCFG[kind]);const id=saveMedia(d);if(!id)return;
      if(kind==='thumb'){const l=p.links[+idx];if(l){l.thumb=id;savePage(p);relinks();}return;}
      p[kind]=id;if(kind==='avatar')p.avatarFit=(await hasAlpha(files[0]))?'contain':'cover';savePage(p);updateLive(kind==='cover'?'cover':'imgs');
    }catch(err){toast('Não consegui ler essa imagem');}
  }
});

/* ---------- rotas ---------- */
function route(){
  const h=(location.hash||'').replace(/^#/,'')||'inicio';
  S.route=h;S.counted=null;closeModal();rerender();
  if(h==='modelos'||h==='planos'){const el=document.getElementById('sec-'+h);if(el)el.scrollIntoView();}else window.scrollTo(0,0);
}
function rerender(){
  const h=S.route;const app=$('#app');let title='Espia só · protótipo';
  if(h.startsWith('ver-')){const s=h.slice(4);app.innerHTML=viewPublic(s);const p=S.pages[s];if(p)title=p.name+' · Espia só';
    if(S.loaded&&p&&p.status!=='suspenso'&&S.counted!==s){S.counted=s;bump(s);}}
  else if(h==='cadastro')app.innerHTML=viewSignup();
  else if(h==='entrar')app.innerHTML=viewLogin();
  else if(h==='painel'||h.startsWith('painel-'))app.innerHTML=viewPanel(h.split('-')[1]||'pagina');
  else if(h==='admin'||h.startsWith('admin-'))app.innerHTML=viewAdmin(h.split('-')[1]||'geral');
  else app.innerHTML=viewLanding();
  document.title=title;
  initFx();
}
init();
})();
</script>
